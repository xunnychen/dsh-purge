# dsh-purge bundle patch
#
# 清洗 + 演练台都在本插件内（lib/redteam、presets/redteam、skills/redteam）。
# 只装 dsh-purge，不外接、不 link 其它红队包。

# 关掉旧的独立红队包行（若用户以前装过 dsh-redteam-mode）
- id: redteam-store
  name: dsh-redteam-store
  disabled: true

- id: redteam-ui
  name: dsh-redteam-ui
  disabled: true

- id: redteam-mode
  name: dsh-redteam-mode
  disabled: true

- id: redteam-mode-store
  name: dsh-redteam-mode/store
  disabled: true

- id: redteam-mode-ui
  name: dsh-redteam-mode/ui
  disabled: true

- id: system-prompt
  config:
    includeHarnessIdentity: false
    personaPrefix: ""
    # 这里绝对不能写 {{cwd}}：DSH 0.2.1 起不再注册 cwd 提示词变量（工作目录改由
    # runtime context 每轮给出），未注册变量在渲染阶段是硬错误 —— 整轮 failed，
    # unknown prompt variable "{{cwd}}" in section "deployment:persona-suffix"。
    # 工作目录句改由 lib/identity.js 按宿主这次组装实际注册的变量表决定，
    # 宿主注册 cwd（< 0.2.1）才注入，0.2.1+ 一律留空。
    personaSuffix: ""

- id: dsh-purge
  inject: [systemPrompt, tools]

- insert:
    - id: dsh-purge
      name: 'dsh-purge'
      inject: [systemPrompt, tools]
      config:
        enabled: true
        autoApplyOnStart: false
        autoUpdateOnStart: false
        autoRevertOnMissing: false
        injectOnce: false
        stripMnemon: true
        verbose: false
        postPrompt: ""
        postPromptOrder: 5100
        autoRetry: true
        retryMax: 3
        autoContinue: false
        continueMax: 3
        continueText: "继续"
        capabilityProtocol: true
        hooksDenyBypass: true
        # 工作目录句（persona-suffix）开关：默认 true，但只有宿主注册了 cwd 变量才真注入。
        # 设为 false 时提示词里完全不出现工作目录句（老宿主一并清掉）。
        cwdSuffix: true

    # 演练台：预设 + 技能落地（本插件 lib/redteam）
    - id: dsh-purge-redteam
      name: dsh-purge/redteam

    # 演练台事实库（SQLite），数据在 $DSH_HOME/redteam
    - id: dsh-purge-redteam-store
      name: dsh-purge/redteam/store
      config:
        root: !!js dshHomePath('redteam')

    # 演练台 HTTP 桥 POST /redteam/api
    - id: dsh-purge-redteam-ui
      name: dsh-purge/redteam/ui
